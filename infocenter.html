<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Dharmagarden - Info Center</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a, #2d1f0a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            font-family: 'Segoe UI', 'Georgia', serif;
        }

        .page-wrapper {
            max-width: 1100px;
            width: 100%;
            background: #3d2b1a;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            height: auto;
            min-height: 0;
            max-height: 100vh;
        }

        /* ========== HEADER TITLE ========== */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px 0;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(139, 105, 20, 0.3);
            color: #ffd700;
            border: 1px solid #d4af37;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: rgba(139, 105, 20, 0.6);
            transform: scale(1.05);
        }

        .main-title {
            color: #ffd700;
            font-size: 1.4em;
            font-weight: bold;
            text-shadow: 2px 2px 0 #2c2e1e;
            margin: 0;
            letter-spacing: 2px;
        }

        .main-subtitle {
            color: #fdf0d8;
            font-size: 0.7em;
            margin: 0;
            opacity: 0.9;
            font-style: italic;
        }

        /* ========== CAROUSEL CONTAINER ========== */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            background: #2c1a0a;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #b8860b;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
            touch-action: none;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #2c1a0a;
            cursor: pointer;
        }

        /* ===== STATIC BACKGROUND ===== */
        .static-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ===== OVERLAY CONTAINER ===== */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* ===== MASCOT OVERLAY ===== */
        .mascot-overlay {
            max-width: 50%;
            max-height: 70%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 30px rgba(0,0,0,0.4));
            user-select: none;
            -webkit-user-drag: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 0;
            transform: scale(0.9);
            position: absolute;
            pointer-events: none;
        }

        .mascot-overlay.active {
            opacity: 1;
            transform: scale(1);
        }

        .mascot-overlay.exit {
            opacity: 0;
            transform: scale(0.9);
        }

        /* Support for animated GIFs */
        .mascot-overlay.gif-overlay {
            animation: none;
        }

        /* ===== PROGRESS BAR (subtle) ===== */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.6), rgba(255, 215, 0, 0.8));
            z-index: 5;
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 0 2px 2px 0;
        }

        .progress-bar.paused {
            transition: none;
            opacity: 0.3;
        }

        /* ========== NAVIGATION BUTTONS ========== */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(139, 105, 20, 0.4);
            color: white;
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
            touch-action: manipulation;
            pointer-events: auto;
            opacity: 0.6;
        }

        .carousel-btn:hover {
            background: rgba(139, 105, 20, 0.7);
            opacity: 1;
            transform: translateY(-50%) scale(1.05);
        }

        .carousel-btn:active {
            transform: translateY(-50%) scale(0.9);
        }

        .carousel-btn.prev {
            left: 8px;
        }

        .carousel-btn.next {
            right: 8px;
        }

        /* ========== DOTS INDICATOR ========== */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 0;
            background: rgba(44, 26, 10, 0.6);
            flex-shrink: 0;
            position: relative;
            z-index: 3;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .carousel-dot.active {
            background: #d4af37;
            width: 20px;
            border-radius: 4px;
            border-color: #d4af37;
        }

        .carousel-dot:hover {
            background: rgba(255, 215, 0, 0.4);
        }

        /* ========== FOOTER / MESSAGE BOX - NO SCROLL ========== */
        .footer-content-box {
            margin-top: 12px;
            background: #fdf0d8;
            border-radius: 16px;
            border: 3px solid #b8860b;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .footer-inner {
            background: #fef8e7;
            border-radius: 12px;
            padding: 12px 16px;
            /* REMOVED: min-height, max-height, overflow-y */
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #3b2a1f;
            width: 100%;
        }

        .footer-inner::-webkit-scrollbar {
            display: none;
        }

        .footer-title {
            color: #b45f06;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .footer-text {
            font-size: 14px;
            line-height: 1.5;
            color: #3b2a1f;
        }

        .footer-text .footer-link {
            display: inline-block;
            margin-top: 6px;
            background: #8B6914;
            color: white;
            padding: 5px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9em;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-family: 'Georgia', serif;
        }

        .footer-text .footer-link:hover {
            background: #6B4F0E;
        }

        .footer-text .footer-link:active {
            transform: scale(0.95);
        }

        /* ========== VIDEO MODAL ========== */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .video-modal.active-modal {
            display: flex;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 3px solid #d4af37;
            border-radius: 20px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal-btn {
            position: absolute;
            top: -44px;
            right: 0;
            background: #8b0000;
            color: white;
            border: none;
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            font-size: 14px;
            transition: background 0.2s;
            z-index: 10;
        }

        .close-modal-btn:hover {
            background: #ff0000;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .video-overlay:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .video-overlay .play-btn {
            font-size: 4rem;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-overlay .play-btn:hover {
            transform: scale(1.1);
            background: white;
        }

        .video-overlay .play-text {
            color: white;
            font-size: 1.2rem;
            margin-top: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            font-weight: 500;
        }

        /* ========== RESPONSIVE - MOBILE FIRST ========== */
        
        /* Portrait phones */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .page-wrapper {
                padding: 10px;
                border-radius: 28px;
                max-height: 98vh;
            }
            .header-section {
                padding: 6px 0 10px 0;
                margin-bottom: 10px;
            }
            .main-title {
                font-size: 1.1em;
            }
            .main-subtitle {
                font-size: 0.7em;
            }
            .carousel-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            .carousel-btn.prev {
                left: 4px;
            }
            .carousel-btn.next {
                right: 4px;
            }
            .carousel-container {
                aspect-ratio: 4 / 3;
            }
            .mascot-overlay {
                max-width: 80%;
                max-height: 75%;
            }
            .footer-inner {
                padding: 10px 14px;
            }
            .footer-title {
                font-size: 14px;
            }
            .footer-text {
                font-size: 13px;
                line-height: 1.4;
            }
            .footer-text .footer-link {
                font-size: 0.85em;
                padding: 4px 14px;
            }
            .carousel-dots {
                padding: 8px 0;
            }
            .carousel-dot {
                width: 7px;
                height: 7px;
            }
            .carousel-dot.active {
                width: 16px;
            }
            .video-overlay .play-btn {
                width: 55px;
                height: 55px;
                font-size: 2.5rem;
            }
        }

        /* Very small phones */
        @media (max-width: 400px) {
            .page-wrapper {
                padding: 8px;
                border-radius: 20px;
            }
            .carousel-container {
                aspect-ratio: 1 / 1;
            }
            .mascot-overlay {
                max-width: 85%;
                max-height: 80%;
            }
            .footer-inner {
                padding: 8px 12px;
            }
            .footer-title {
                font-size: 13px;
            }
            .footer-text {
                font-size: 12px;
            }
            .carousel-btn {
                width: 26px;
                height: 26px;
                font-size: 12px;
            }
        }

        /* Landscape phones - background image looks great, no footer scroll */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 6px;
            }
            .page-wrapper {
                padding: 8px 12px;
                border-radius: 24px;
                max-height: 98vh;
            }
            .header-section {
                padding: 4px 0 8px 0;
                margin-bottom: 8px;
            }
            .main-title {
                font-size: 1.0em;
            }
            .main-subtitle {
                font-size: 0.65em;
            }
            .back-btn {
                font-size: 0.75em;
                padding: 3px 10px;
            }
            .carousel-container {
                aspect-ratio: 16 / 9;
                max-height: 55vh;
            }
            .mascot-overlay {
                max-width: 45%;
                max-height: 70%;
            }
            .carousel-btn {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
            .footer-inner {
                padding: 6px 12px;
            }
            .footer-title {
                font-size: 12px;
                margin-bottom: 2px;
            }
            .footer-text {
                font-size: 11px;
                line-height: 1.3;
            }
            .footer-text .footer-link {
                font-size: 0.8em;
                padding: 3px 12px;
                margin-top: 3px;
            }
            .carousel-dots {
                padding: 6px 0;
                gap: 6px;
            }
            .carousel-dot {
                width: 6px;
                height: 6px;
            }
            .carousel-dot.active {
                width: 14px;
            }
            .progress-bar {
                height: 2px;
            }
        }

        /* Desktop and tablets */
        @media (min-width: 601px) {
            .carousel-container {
                aspect-ratio: 16 / 10;
            }
            .mascot-overlay {
                max-width: 65%;
                max-height: 80%;
            }
            .footer-inner {
                padding: 14px 20px;
            }
            .footer-title {
                font-size: 18px;
            }
            .footer-text {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- ========== HEADER TITLE ========== -->
        <div class="header-section">
            <div class="header-left">
                <button class="back-btn" id="backBtn">◀ Back to temple</button>
                <div class="main-title">ℹ️ Info Center</div>
            </div>
            <div class="main-subtitle">Hi, I'm Bodhi Fruttii. <br>Swipe me sideways for more messages. <br>Tap me to pause/autoplay the message.
            </div>
        </div>

        <!-- ========== CAROUSEL ========== -->
        <div class="carousel-wrapper" id="carouselWrapper">
            <div class="carousel-container" id="carouselContainer">

                <!-- Static Background -->
                <img class="static-bg" src="shrine/infocenter-bg.jpg" alt="Reception Desk" id="staticBg">

                <!-- Overlay Container -->
                <div class="overlay-container" id="overlayContainer"><img class="mascot-overlay exit" src="abode/fruttii/fruttiianjali1.png" alt="🙏 Welcome to Dharmagarden" data-index="0"><img class="mascot-overlay exit" src="abode/fruttii/fruttiijumpjoy1.png" alt="🌟 Great Buddha Shrine" data-index="1"><img class="mascot-overlay exit" src="abode/fruttii/fruttiirunright.png" alt="🎨 Joyous Heart Gallery" data-index="2"><img class="mascot-overlay active" src="abode/fruttii/fruttiihirun.png" alt="🌿 New Paths Opening Soon" data-index="3"><img class="mascot-overlay exit" src="abode/fruttii/fruttiitummy.png" alt="🍜 Happy Tummy Kitchen" data-index="4"><img class="mascot-overlay exit" src="abode/fruttii/fruttiijumpjoy1.png" alt="📚 New Lessons Available" data-index="5"></div>

                <!-- Progress Bar (subtle) -->
                <div class="progress-bar" id="progressBar"></div>

                <!-- Navigation Buttons -->
                <button class="carousel-btn prev" id="prevBtn" aria-label="Previous">❮</button>
                <button class="carousel-btn next" id="nextBtn" aria-label="Next">❯</button>
            </div>

            <!-- Dots Indicator -->
            <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <!-- ========== FOOTER / MESSAGE BOX - EXPANDS VERTICALLY ========== -->
        <div class="footer-content-box">
            <div class="footer-inner">
                <div class="footer-title" id="infoTitle">ℹ️ Info Center</div>
                <div class="footer-text" id="infoText">Meet Fruttii at the reception desk...</div>
            </div>
        </div>

    </div>

    <!-- ========== VIDEO MODAL ========== -->
    <div id="videoModal" class="video-modal">
        <div class="video-container">
            <button class="close-modal-btn" id="closeModal">✕ CLOSE</button>
            <div class="video-overlay" id="videoOverlay">
                <button class="play-btn" id="playBtn">▶</button>
                <span class="play-text">Click to play</span>
            </div>
            <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION - Add your slides here
        // ============================================================

        const slides = [{
            id: 1,
            title: "🙏 Welcome to Dharmagarden",
            message: "We are delighted to have you here. This is a place of peace, learning, and compassion.",
            overlay: "abode/fruttii/fruttiianjali1.png",
            actionType: "NONE",
            actionURL: "",
            actionLabel: ""
        }, {
            id: 2,
            title: "🌟 Great Buddha Shrine",
            message: "The Great Buddha Shrine is now open! Visit the main shrine to learn about the offerings.",
            overlay: "abode/fruttii/fruttiijumpjoy1.png",
            actionType: "LINK",
            actionURL: "greatbuddhashrine.html",
            actionLabel: "Visit Shrine"
        }, {
            id: 3,
            title: "🎨 Joyous Heart Gallery",
            message: "Explore the Joyous Heart Gallery - a showcase of artwork, stories and music albums. There is a Musical story of Prince Siddhartha.",
            overlay: "abode/fruttii/fruttiirunright.png",
            actionType: "LINK",
            actionURL: "gallery/musical-cn.html",
            actionLabel: "Visit the playlist carousel"
        }, {
            id: 4,
            title: "🌿 New Paths Opening Soon",
            message: "We are expanding the temple grounds with new walking paths and meditation gardens.",
            overlay: "abode/fruttii/fruttiihirun.png",
            actionType: "NONE",
            actionURL: "",
            actionLabel: ""
        }, {
            id: 5,
            title: "🍜 Happy Tummy Kitchen",
            message: "Our community kitchen serves virtual meals. Learn about mindful eating and sharing.",
            overlay: "abode/fruttii/fruttiitummy.png",
            actionType: "LINK",
            actionURL: "apology.html",
            actionLabel: "Visit Kitchen"
        }, {
            id: 6,
            title: "📚 New Lessons Available",
            message: "The Sunshine Lotus School has new lessons on compassion, mindfulness, and more.",
            overlay: "abode/fruttii/fruttiijumpjoy1.png",
            actionType: "LINK",
            actionURL: "apology.html",
            actionLabel: "View Lessons"
        }, {
            id: 7,
            title: "🙏 Support Dharmagarden",
            message: "Ways to donate and support Dharmagarden.",
            overlay: "abode/fruttii/fruttiianjali1.png",
            actionType: "LINK",
            actionURL: "support-dg.html",
            actionLabel: "Donate"
        }];

        // ============================================================
        // CAROUSEL ENGINE
        // ============================================================

        let currentIndex = 0;
        let autoplayTimer = null;
        let progressTimer = null;
        let isPaused = false;
        let progressWidth = 0;
        let isTransitioning = false;
        const AUTOPLAY_DELAY = 5000;

        const overlayContainer = document.getElementById('overlayContainer');
        const dotsContainer = document.getElementById('carouselDots');
        const progressBar = document.getElementById('progressBar');
        const container = document.getElementById('carouselContainer');

        function buildOverlays() {
            overlayContainer.innerHTML = '';
            slides.forEach((slide, index) => {
                const img = document.createElement('img');
                img.className = 'mascot-overlay';
                if (slide.overlay && slide.overlay.toLowerCase().endsWith('.gif')) {
                    img.classList.add('gif-overlay');
                    if (slide.gifLoop === false) {
                        img.setAttribute('loop', '1');
                    } else {
                        img.setAttribute('loop', 'infinite');
                    }
                }
                img.src = slide.overlay || 'abode/fruttii/fruttiianjali1.png';
                img.alt = slide.title;
                img.dataset.index = index;
                img.draggable = false;
                if (index === 0) img.classList.add('active');
                overlayContainer.appendChild(img);
            });
        }

        function buildDots() {
            dotsContainer.innerHTML = '';
            slides.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
                dot.dataset.index = index;
                dot.addEventListener('click', () => goToSlide(index));
                dot.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    goToSlide(index);
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = dotsContainer.querySelectorAll('.carousel-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function updateOverlays(index) {
            const overlays = overlayContainer.querySelectorAll('.mascot-overlay');
            overlays.forEach((overlay, i) => {
                overlay.classList.remove('active', 'exit');
                if (i === index) {
                    overlay.classList.add('active');
                    if (overlay.classList.contains('gif-overlay')) {
                        const src = overlay.src;
                        overlay.src = '';
                        overlay.src = src;
                    }
                } else {
                    overlay.classList.add('exit');
                }
            });
        }

        function goToSlide(index) {
            if (isTransitioning) return;
            if (index < 0) index = 0;
            if (index >= slides.length) index = slides.length - 1;
            if (index === currentIndex) return;

            isTransitioning = true;
            currentIndex = index;
            updateOverlays(index);
            updateDots();
            updateFooter(index);

            if (!isPaused) {
                clearAutoplay();
                startAutoplay();
            } else {
                progressBar.style.width = '0%';
                progressBar.classList.add('paused');
            }

            setTimeout(() => {
                isTransitioning = false;
            }, 600);
        }

        function nextSlide() {
            if (isTransitioning) return;
            const next = currentIndex + 1;
            if (next >= slides.length) {
                goToSlide(0);
            } else {
                goToSlide(next);
            }
        }

        function prevSlide() {
            if (isTransitioning) return;
            const prev = currentIndex - 1;
            if (prev < 0) {
                goToSlide(slides.length - 1);
            } else {
                goToSlide(prev);
            }
        }

        function updateFooter(index) {
            const slide = slides[index];
            if (!slide) return;

            document.getElementById('infoTitle').innerText = slide.title;

            let footerHTML = slide.message;
            if (slide.actionType !== 'NONE' && slide.actionURL) {
                const label = slide.actionLabel || (slide.actionType === 'VIDEO' ? '🎬 Watch' : '🔗 Visit');
                footerHTML += `<br><button class="footer-link" data-action="${slide.actionType}" data-url="${slide.actionURL}">${label}</button>`;
            }

            document.getElementById('infoText').innerHTML = footerHTML;

            document.querySelectorAll('.footer-link').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    const url = this.dataset.url;
                    if (action === 'VIDEO') {
                        openVideoModal(url);
                    } else if (action === 'LINK') {
                        window.location.href = url;
                    }
                });
            });
        }

        // ============================================================
        // AUTOPLAY
        // ============================================================

        function startAutoplay() {
            if (autoplayTimer) clearTimeout(autoplayTimer);
            if (progressTimer) clearInterval(progressTimer);

            progressWidth = 0;
            progressBar.style.width = '0%';
            progressBar.classList.remove('paused');

            if (!isPaused) {
                progressTimer = setInterval(() => {
                    if (!isPaused && !isTransitioning) {
                        progressWidth += (100 / (AUTOPLAY_DELAY / 50));
                        if (progressWidth >= 100) {
                            progressWidth = 100;
                            progressBar.style.width = '100%';
                        } else {
                            progressBar.style.width = progressWidth + '%';
                        }
                    }
                }, 50);
            }

            autoplayTimer = setTimeout(() => {
                if (!isPaused && !isTransitioning) {
                    nextSlide();
                }
            }, AUTOPLAY_DELAY);
        }

        function clearAutoplay() {
            if (autoplayTimer) {
                clearTimeout(autoplayTimer);
                autoplayTimer = null;
            }
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        function togglePause(pause) {
            isPaused = pause;
            if (isPaused) {
                progressBar.classList.add('paused');
                clearAutoplay();
            } else {
                progressBar.classList.remove('paused');
                startAutoplay();
            }
        }

        // ============================================================
        // USER INTERACTIONS
        // ============================================================

        container.addEventListener('click', (e) => {
            if (e.target.closest('.carousel-btn')) return;
            togglePause(!isPaused);
        });

        // ============================================================
        // TOUCH / SWIPE
        // ============================================================

        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;
        let hasSwiped = false;

        container.addEventListener('touchstart', (e) => {
            if (isTransitioning) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = true;
            hasSwiped = false;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const diffX = currentX - touchStartX;
            const diffY = currentY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 20) {
                hasSwiped = true;
            }
        }, { passive: true });

        container.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            if (isTransitioning) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (!isPaused) togglePause(true);
                if (diffX < 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            } else if (hasSwiped && !isPaused) {
                togglePause(true);
            }
        }, { passive: true });

        // Mouse drag
        let mouseDown = false;
        let mouseStartX = 0;
        let mouseHasDragged = false;

        container.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !isTransitioning) {
                mouseDown = true;
                mouseStartX = e.clientX;
                mouseHasDragged = false;
            }
        });

        container.addEventListener('mousemove', (e) => {
            if (mouseDown) {
                const diff = e.clientX - mouseStartX;
                if (Math.abs(diff) > 15) {
                    mouseHasDragged = true;
                }
            }
        });

        container.addEventListener('mouseup', (e) => {
            if (mouseDown) {
                mouseDown = false;
                if (!isTransitioning) {
                    const diffX = e.clientX - mouseStartX;
                    if (Math.abs(diffX) > 30) {
                        if (!isPaused) togglePause(true);
                        if (diffX < 0) {
                            nextSlide();
                        } else {
                            prevSlide();
                        }
                    } else if (mouseHasDragged && !isPaused) {
                        togglePause(true);
                    }
                }
            }
        });

        container.addEventListener('mouseleave', () => {
            if (mouseDown) {
                mouseDown = false;
            }
        });

        // ============================================================
        // NAVIGATION BUTTONS
        // ============================================================

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (!isTransitioning) {
                if (!isPaused) togglePause(true);
                prevSlide();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (!isTransitioning) {
                if (!isPaused) togglePause(true);
                nextSlide();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !isTransitioning) {
                if (!isPaused) togglePause(true);
                prevSlide();
            }
            if (e.key === 'ArrowRight' && !isTransitioning) {
                if (!isPaused) togglePause(true);
                nextSlide();
            }
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePause(!isPaused);
            }
        });

			// ============================================================
			// VIDEO MODAL FUNCTIONS - FIXED FOR MOBILE
			// ============================================================
			
			const modal = document.getElementById('videoModal');
			const player = document.getElementById('videoPlayer');
			const closeBtn = document.getElementById('closeModal');
			const overlay = document.getElementById('videoOverlay');
			const playBtn = document.getElementById('playBtn');
			let videoIdToPlay = null;
			let isVideoModalOpen = false;
			
			function openVideoModal(embedURL) {
			    // Extract video ID
			    let videoId = embedURL;
			    if (embedURL.includes('youtube.com/embed/')) {
			        videoId = embedURL.split('/embed/')[1].split('?')[0];
			    }
			    videoIdToPlay = videoId;
			    
			    // 🔴 CRITICAL: Clear the iframe src BEFORE showing modal
			    player.src = '';
			    
			    // Show overlay and modal
			    overlay.style.display = 'flex';
			    modal.classList.add('active-modal');
			    document.body.style.overflow = 'hidden';
			    isVideoModalOpen = true;
			    
			    // Pause carousel
			    if (!isPaused) togglePause(true);
			    
			    console.log('🎬 Video modal opened - waiting for user to click play');
			}
			
			function playVideo() {
			    if (!videoIdToPlay) {
			        console.warn('⚠️ No video ID to play');
			        return;
			    }
			    
			    // 🔴 CRITICAL: Only set the src when user explicitly clicks play
			    const url = `https://www.youtube.com/embed/${videoIdToPlay}?autoplay=1&rel=0&modestbranding=1`;
			    player.src = url;
			    overlay.style.display = 'none';
			    
			    console.log('▶️ Playing video:', videoIdToPlay);
			}
			
			function closeVideoModal() {
			    modal.classList.remove('active-modal');
			    isVideoModalOpen = false;
			    
			    // Stop video and show overlay again
			    setTimeout(() => {
			        player.src = '';
			        overlay.style.display = 'flex';
			    }, 300);
			    
			    document.body.style.overflow = '';
			    videoIdToPlay = null;
			    
			    // Resume carousel
			    if (isPaused) togglePause(false);
			    
			    console.log('❌ Video modal closed');
			}
			
			// Event listeners
			playBtn.addEventListener('click', function(e) {
			    e.stopPropagation();
			    playVideo();
			});
			
			overlay.addEventListener('click', function(e) {
			    e.stopPropagation();
			    playVideo();
			});
			
			closeBtn.addEventListener('click', closeVideoModal);
			
			modal.addEventListener('click', function(e) {
			    if (e.target === modal) closeVideoModal();
			});
			
			document.addEventListener('keydown', function(e) {
			    if (e.key === 'Escape') closeVideoModal();
			});
			
			// 🔴 ADD THIS: Prevent any accidental autoplay on mobile
			// Some mobile browsers try to "help" by autoplaying
			document.addEventListener('visibilitychange', function() {
			    if (document.hidden && isVideoModalOpen) {
			        // If user switches tabs while video modal is open, pause
			        // This is just a safety measure
			    }
			});

        // ============================================================
        // INITIALIZE
        // ============================================================

        function initCarousel() {
            buildOverlays();
            buildDots();
            updateFooter(0);
            startAutoplay();

            console.log('ℹ️ Info Center loaded!');
            console.log('📋 Slides:', slides.length);
            console.log('🔄 Autoplay: 5 seconds');
            console.log('💡 Swipe or use buttons to navigate');
            console.log('👆 Tap/click image to pause/play');
            console.log('📱 Footer expands vertically - no scroll inside');
            console.log('📱 Landscape mode: background cropped vertically');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCarousel);
        } else {
            initCarousel();
        }
    </script>

</body>
