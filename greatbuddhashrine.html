<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- UPDATED: Enable pinch-zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Great Buddha Shrine - Dharmagarden</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a, #2d1f0a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            font-family: 'Segoe UI', 'Georgia', serif;
        }

        .page-wrapper {
            max-width: 1100px;
            width: 100%;
            background: #3d2b1a;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ========== HEADER TITLE ========== */
        .header-section {
            text-align: center;
            padding: 10px 0 15px 0;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(139, 105, 20, 0.3);
            color: #ffd700;
            border: 1px solid #d4af37;
            padding: 6px 10px;
            border-radius: 13px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            white-space: nowrap;
        }

        .back-btn:hover {
            background: rgba(139, 105, 20, 0.6);
            transform: scale(1.05);
        }

        .main-title {
            color: #ffd700;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 0 #2c2e1e;
            margin: 0;
            letter-spacing: 2px;
        }

        .main-subtitle {
            color: #fdf0d8;
            font-size: 0.85em;
            margin: 0;
            opacity: 0.9;
            font-style: italic;
        }

        /* ========== MAP CONTAINER ========== */
        .menu-map-wrapper {
            position: relative;
            width: 100%;
            background: #2c1a0a;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #b8860b;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .image-container {
            position: relative;
            width: 100%;
            background: #2c1a0a;
            overflow: hidden;
        }

        .menu-bg-image {
            width: 100%;
            height: auto;
            display: block;
            background: #2c1a0a;
            border-radius: 5;
            image-rendering: auto;
        }

        #spriteLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ========== SPRITE STYLES ========== */
        .menu-sprite {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            background: none;
            border: none;
            border-radius: 0;
            opacity: 1;
        }

        .menu-sprite:hover {
            transform: translate(-50%, -50%) scale(1.15) !important;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)) !important;
            z-index: 30;
        }

        .menu-sprite:active {
            transform: translate(-50%, -50%) scale(0.95) !important;
        }

        .menu-sprite.touched {
            transform: translate(-50%, -50%) scale(1.1) !important;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)) !important;
        }

        /* Selected sprite state */
        .menu-sprite.selected {
            transform: translate(-50%, -50%) scale(1.2) !important;
            filter: drop-shadow(0 0 35px rgba(255, 215, 0, 1)) drop-shadow(0 0 60px rgba(255, 200, 0, 0.7)) !important;
            z-index: 50;
            animation: spriteGlow 1.5s ease-in-out infinite;
        }

        @keyframes spriteGlow {
            0%, 100% {
                filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 50px rgba(255, 200, 0, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 45px rgba(255, 215, 0, 1)) drop-shadow(0 0 80px rgba(255, 200, 0, 0.8));
            }
        }

        /* Special glow for service hotspots */
        .menu-sprite.service-sprite {
            animation: servicePulse 2s ease-in-out infinite;
        }

        @keyframes servicePulse {
            0%, 100% { 
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)) drop-shadow(0 0 10px rgba(255, 100, 50, 0.3));
            }
            50% { 
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)) drop-shadow(0 0 30px rgba(255, 150, 50, 0.7));
            }
        }

        /* ========== FOOTER / DESCRIPTION BOX ========== */
        .footer-content-box {
            margin-top: 15px;
            background: #fdf0d8;
            border-radius: 16px;
            border: 3px solid #b8860b;
            padding: 5px;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .footer-inner {
            background: #fef8e7;
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #3b2a1f;
            width: 100%;
            /* No min/max height - expands vertically */
        }

        .footer-title {
            color: #b45f06;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-title .sprite-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            vertical-align: middle;
        }

        .footer-text {
            font-size: 15px;
            line-height: 1.6;
            color: #3b2a1f;
        }

        .footer-text .feedback-message {
            color: #b45f06;
            font-weight: bold;
            font-style: italic;
        }

        /* Small sprite preview in footer */
        .footer-sprite-preview {
            display: none;
            text-align: center;
            margin-bottom: 8px;
        }

        .footer-sprite-preview.active {
            display: block;
        }

        .footer-sprite-preview img {
            max-width: 80px;
            max-height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.6));
            animation: spritePreviewPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes spritePreviewPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Service action button in footer */
        .footer-action-btn {
            display: inline-block;
            margin-top: 10px;
            background: linear-gradient(145deg, #8B6914, #6B4F0E);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            box-shadow: 0 3px 10px rgba(139, 105, 20, 0.3);
        }

        .footer-action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(139, 105, 20, 0.5);
        }

        .footer-action-btn:active {
            transform: scale(0.95);
        }

        .footer-action-btn.service-action {
            background: linear-gradient(145deg, #d45a1a, #a8440a);
        }

        .footer-action-btn.service-action:hover {
            background: #8a3808;
        }

        /* ========== VIDEO MODAL ========== */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .video-modal.active-modal {
            display: flex;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 3px solid #d4af37;
            border-radius: 20px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal-btn {
            position: absolute;
            top: -44px;
            right: 0;
            background: #8b0000;
            color: white;
            border: none;
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            font-size: 14px;
            transition: background 0.2s;
            z-index: 10;
        }

        .close-modal-btn:hover {
            background: #ff0000;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .video-overlay:hover {
            background: rgba(0,0,0,0.1);
        }

        .video-overlay .play-btn {
            font-size: 4rem;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-overlay .play-btn:hover {
            transform: scale(1.1);
            background: white;
        }

        .video-overlay .play-text {
            color: white;
            font-size: 1.2rem;
            margin-top: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            font-weight: 500;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            .page-wrapper {
                padding: 10px;
                border-radius: 16px;
            }
            .header-section {
                flex-direction: column;
                gap: 8px;
                padding: 6px 0 10px 0;
                margin-bottom: 10px;
            }
            .header-left {
                width: 100%;
                justify-content: space-between;
            }
            .main-title {
                font-size: 1.1em;
            }
            .main-subtitle {
                font-size: 0.7em;
            }
            .back-btn {
                font-size: 0.75em;
                padding: 4px 10px;
            }
            .footer-inner {
                padding: 10px 14px;
            }
            .footer-title {
                font-size: 15px;
            }
            .footer-text {
                font-size: 13px;
                line-height: 1.5;
            }
            .footer-sprite-preview img {
                max-width: 60px;
                max-height: 60px;
            }
            .footer-action-btn {
                font-size: 0.9em;
                padding: 6px 18px;
            }
            .video-overlay .play-btn {
                width: 60px;
                height: 60px;
                font-size: 3rem;
            }
        }

        @media (max-width: 400px) {
            .footer-inner {
                padding: 8px 12px;
            }
            .footer-title {
                font-size: 13px;
            }
            .footer-text {
                font-size: 12px;
            }
            .footer-sprite-preview img {
                max-width: 50px;
                max-height: 50px;
            }
            .footer-action-btn {
                font-size: 0.8em;
                padding: 5px 14px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 6px;
            }
            .page-wrapper {
                padding: 8px 12px;
            }
            .header-section {
                padding: 4px 0 8px 0;
                margin-bottom: 8px;
            }
            .main-title {
                font-size: 1.0em;
            }
            .main-subtitle {
                font-size: 0.65em;
            }
            .footer-inner {
                padding: 8px 12px;
            }
            .footer-title {
                font-size: 13px;
                margin-bottom: 3px;
            }
            .footer-text {
                font-size: 11px;
                line-height: 1.3;
            }
            .footer-sprite-preview img {
                max-width: 40px;
                max-height: 40px;
            }
            .footer-action-btn {
                font-size: 0.75em;
                padding: 4px 14px;
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- ========== HEADER TITLE ========== -->
        <div class="header-section">
            <div class="header-left">
                <button class="back-btn" id="backBtn">◀ Back to Main Abode</button>
                <div class="main-title">🪷 Buddha Shrine</div>
            </div>
            <div class="main-subtitle">Tap any object to learn its significance</div>
        </div>

        <!-- ========== MAP CONTAINER ========== -->
        <div class="menu-map-wrapper">
            <div class="image-container">
                <img class="menu-bg-image" src="greatbuddhashrine/altarbg.jpg" alt="Great Buddha Shrine Interior" id="bgImage">
                <div id="spriteLayer"></div>
            </div>
        </div>

        <!-- ========== FOOTER / DESCRIPTION BOX ========== -->
        <div class="footer-content-box">
            <div class="footer-inner">
                <!-- Small sprite preview that appears when an item is selected -->
                <div class="footer-sprite-preview" id="footerSpritePreview">
                    <img src="" alt="Selected item" id="footerPreviewImg">
                </div>
                <div class="footer-title" id="infoTitle">🪷 Great Buddha Shrine</div>
                <div class="footer-text" id="infoText">Tap any object on the altar to learn its significance, or tap a service to participate.</div>
            </div>
        </div>

    </div>

    <!-- ========== VIDEO MODAL ========== -->
    <div id="videoModal" class="video-modal">
        <div class="video-container">
            <button class="close-modal-btn" id="closeModal">✕ CLOSE</button>
            <div class="video-overlay" id="videoOverlay">
                <button class="play-btn" id="playBtn">▶</button>
                <span class="play-text">Click to play</span>
            </div>
            <iframe id="videoPlayer" src="" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================

        const MAIN_PAGE_URL = 'index.html';
        const SHRINE_PAGE_URL = 'greatbuddhashrine.html';

        // ============================================================
        // CONFIGURATION - Altar Items and Services
        // ============================================================

        const shrineSprites = [
            // ===== ALTAR ITEMS (offerings) =====
            {
                id: 1,
                name: "Buddha Statue",
                description: "The Buddha statue is a focal point for meditation and reverence. It represents the qualities of the Buddha - wisdom, compassion, and perfect peace. Gazing upon the Buddha statue reminds us of our potential to awaken and encourages us on the path.",
                topPercent: 32,
                leftPercent: 50.02,
                widthPercent: 22.17,
                spriteIcon: "greatbuddhashrine/buddhaimage.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 2,
                name: "Flowers",
                description: "The lotus is a sacred symbol in Buddhism. Growing from muddy water, it blooms pure and unstained - representing our potential to rise above suffering and attain enlightenment. The lotus also symbolizes compassion and wisdom.",
                topPercent: 39.1,
                leftPercent: 65.8,
                widthPercent: 13.96,
                spriteIcon: "greatbuddhashrine/flowers.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 3,
                name: "Light",
                description: "Candles represent the light of wisdom that dispels the darkness of ignorance. Each flame symbolizes the Buddha's teachings that illuminate our path. Lighting a candle is an act of offering light to the world and to our own hearts.",
                topPercent: 43.95,
                leftPercent: 34.2,
                widthPercent: 5.37,
                spriteIcon: "greatbuddhashrine/lamp.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 4,
                name: "Medicinal Drink",
                description: "Medicinal drink offered to the Buddha. In Buddhist tradition, offering medicine represents the wish for all beings to be free from illness and suffering, both physical and mental.",
                topPercent: 63.7,
                leftPercent: 66.55,
                widthPercent: 6.84,
                spriteIcon: "greatbuddhashrine/medicine.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 5,
                name: "Water Offering",
                description: "Water represents purity, clarity, and the refreshing nature of the Dharma. Offering water symbolizes our wish to purify our minds and cultivate a clear, calm, and compassionate heart. It also represents hospitality and respect.",
                topPercent: 63.6,
                leftPercent: 60.2,
                widthPercent: 3.42,
                spriteIcon: "greatbuddhashrine/water.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 6,
                name: "Fruit Offering",
                description: "Fruit represents the fruits of our practice - the results of our efforts on the path. Offering fruit symbolizes our aspiration to realize the fruits of enlightenment. It also represents generosity and sharing our abundance with others.",
                topPercent: 59.3,
                leftPercent: 34.3,
                widthPercent: 16.31,
                spriteIcon: "greatbuddhashrine/fruits.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 7,
                name: "Incense",
                description: "Incense represents the fragrance of the Dharma. The rising smoke symbolizes our prayers rising to the heavens. Burning incense purifies the environment and our minds, creating a sacred space for meditation and reflection.",
                topPercent: 57.6,
                leftPercent: 50.25,
                widthPercent: 10.84,
                spriteIcon: "greatbuddhashrine/incense.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },
            {
                id: 8,
                name: "Prayer Bell",
                description: "The prayer bell is used during puja chanting. Its sound represents the voice of the Buddha, calling us to mindfulness. Ringing the bell purifies the atmosphere and awakens us from the sleep of ignorance.",
                topPercent: 73,
                leftPercent: 14.02,
                widthPercent: 27.54,
                spriteIcon: "greatbuddhashrine/prayerbell.png",
                type: "ITEM",
                actionType: "INFO",
                targetURL: ""
            },

            // ===== SERVICES =====
            {
                id: 9,
                name: "🪔 Light Incense",
                description: "Light an incense stick and make a wish. The fragrant smoke carries your prayers to the heavens. As you light the incense, focus on your intention for peace, happiness, and well-being for all beings.",
                topPercent: 77,
                leftPercent: 41,
                widthPercent: 10,
                spriteIcon: "greatbuddhashrine/incense.png",
                type: "SERVICE",
                actionType: "SERVICE",
                targetURL: "",
                serviceAction: "incense"
            },
            {
                id: 10,
                name: "🙏 Make a Wish",
                description: "Bow your head, place your hands together, and make a sincere wish. In this sacred space, your heartfelt wishes are received with compassion. What do you wish for? Peace? Happiness? Understanding?",
                topPercent: 77,
                leftPercent: 48,
                widthPercent: 10,
                spriteIcon: "greatbuddhashrine/flowers.png",
                type: "SERVICE",
                actionType: "SERVICE",
                targetURL: "",
                serviceAction: "wish"
            },
            {
                id: 11,
                name: "🎵 Meditation Bell",
                description: "Listen to the calming sound of the meditation bell. Close your eyes, take a deep breath, and let the sound wash over you. Allow your mind to settle into peace and stillness.",
                topPercent: 77,
                leftPercent: 56,
                widthPercent: 10,
                spriteIcon: "greatbuddhashrine/prayerbell.png",
                type: "SERVICE",
                actionType: "VIDEO",
                targetURL: "https://www.youtube.com/embed/UnQASwhsryM"
            },
            {
                id: 12,
                name: "🧘 Guided Meditation",
                description: "Join a short guided meditation session. Follow the instructions to relax your body, calm your mind, and connect with your inner peace. All are welcome, no experience needed.",
                topPercent: 77,
                leftPercent: 67,
                widthPercent: 12,
                spriteIcon: "greatbuddhashrine/buddhaimage.png",
                type: "SERVICE",
                actionType: "VIDEO",
                targetURL: "https://www.youtube.com/embed/UnQASwhsryM"
            }
        ];

        // ============================================================
        // STATE MANAGEMENT
        // ============================================================

        const templeEntered = sessionStorage.getItem('templeEntered') === 'true';
        let selectedSprite = null;
        let currentSprite = null;

        console.log('🪷 Temple entered state:', templeEntered);

        // ============================================================
        // NAVIGATION - Back to Main Page
        // ============================================================

        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('◀ Returning to main temple...');

            try {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = MAIN_PAGE_URL;
                }
            } catch (error) {
                window.location.href = MAIN_PAGE_URL;
            }
        });

        // ============================================================
        // SPRITE SELECTION & FOOTER UPDATE
        // ============================================================

        function selectSprite(sprite, imgElement) {
            // Clear previous selection
            if (selectedSprite) {
                selectedSprite.classList.remove('selected');
            }

            // Set new selection
            selectedSprite = imgElement;
            imgElement.classList.add('selected');
            currentSprite = sprite;
            
            // Update footer with sprite preview and description
            updateFooterWithSprite(sprite);
        }

        function updateFooterWithSprite(sprite) {
            // Show sprite preview in footer
            const preview = document.getElementById('footerSpritePreview');
            const previewImg = document.getElementById('footerPreviewImg');
            previewImg.src = sprite.spriteIcon;
            preview.classList.add('active');

            // Update title
            document.getElementById('infoTitle').innerHTML =
                `<span>${sprite.name}</span>`;
            
            // Update description based on type
            const infoText = document.getElementById('infoText');
            
            if (sprite.type === 'SERVICE') {
                // Service - show description + participate button
                infoText.innerHTML = `
                    ${sprite.description}
                    <br>
                    <button class="footer-action-btn service-action" id="footerActionBtn">
                        🙏 Participate
                    </button>
                `;
            } else {
                // Regular item - just show description
                infoText.innerHTML = sprite.description;
            }
            
            // Attach event listener to the action button
            const actionBtn = document.getElementById('footerActionBtn');
            if (actionBtn) {
                actionBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    handleFooterAction(sprite);
                });
            }
        }

        function handleFooterAction(sprite) {
            console.log('🎯 Action on:', sprite.name);
            
            if (sprite.actionType === 'SERVICE') {
                handleService(sprite);
            } else if (sprite.actionType === 'VIDEO') {
                openVideoModal(sprite.targetURL);
            } else if (sprite.actionType === 'INFO') {
                showFeedback('📖 ' + sprite.name + ' - Thank you for learning! 🙏');
            }
        }

        // ============================================================
        // SERVICE HANDLERS
        // ============================================================

        function handleService(sprite) {
            switch(sprite.serviceAction) {
                case 'incense':
                    showFeedback('🪔 Lighting incense... May your wishes rise like smoke to the heavens. 🙏');
                    break;
                case 'wish':
                    showFeedback('🙏 Your wish has been received with compassion. May it bring peace and happiness. 🪷');
                    break;
                default:
                    showFeedback('🙏 Thank you for participating. Blessings to you. 🪷');
            }
        }

        function showFeedback(message) {
            const preview = document.getElementById('footerSpritePreview');
            preview.classList.remove('active');

            document.getElementById('infoTitle').innerText = '🙏 Blessings';
            document.getElementById('infoText').innerHTML = `<span class="feedback-message">${message}</span>`;

            // Clear selection
            if (selectedSprite) {
                selectedSprite.classList.remove('selected');
                selectedSprite = null;
            }
            currentSprite = null;
            
            setTimeout(() => {
                resetFooter();
            }, 5000);
        }

        function resetFooter() {
            const preview = document.getElementById('footerSpritePreview');
            preview.classList.remove('active');

            document.getElementById('infoTitle').innerText = '🪷 Great Buddha Shrine';
            document.getElementById('infoText').innerText = 'Tap any object on the altar to learn its significance, or tap a service to participate.';

            if (selectedSprite) {
                selectedSprite.classList.remove('selected');
                selectedSprite = null;
            }
            currentSprite = null;
        }

        // ============================================================
        // VIDEO MODAL
        // ============================================================

        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');
        const closeBtn = document.getElementById('closeModal');
        const overlay = document.getElementById('videoOverlay');
        const playBtn = document.getElementById('playBtn');

        let videoIdToPlay = null;

        function openVideoModal(embedURL) {
            if (!embedURL) {
                console.warn('⚠️ No video URL provided');
                return;
            }

            let videoId = embedURL;
            if (embedURL.includes('youtube.com/embed/')) {
                videoId = embedURL.split('/embed/')[1].split('?')[0];
            }
            
            videoIdToPlay = videoId;
            player.src = '';
            overlay.style.display = 'flex';
            modal.classList.add('active-modal');
            document.body.style.overflow = 'hidden';
            
            console.log('🎬 Video modal opened, ready to play:', videoId);
        }

        function playVideo() {
            if (!videoIdToPlay) return;
            
            const url = `https://www.youtube.com/embed/${videoIdToPlay}?autoplay=1&rel=0&modestbranding=1&enablejsapi=1`;
            player.src = url;
            overlay.style.display = 'none';
            
            console.log('▶️ Playing video:', videoIdToPlay);
        }

        function closeVideoModal() {
            modal.classList.remove('active-modal');
            setTimeout(() => {
                player.src = '';
                overlay.style.display = 'flex';
            }, 300);
            document.body.style.overflow = '';
            videoIdToPlay = null;
            console.log('❌ Video modal closed');
        }

        playBtn.addEventListener('click', playVideo);
        overlay.addEventListener('click', playVideo);

        closeBtn.addEventListener('click', closeVideoModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeVideoModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideoModal();
        });

        // ============================================================
        // BUILD MENU
        // ============================================================

        function buildMenu() {
            const layer = document.getElementById("spriteLayer");
            layer.innerHTML = '';

            shrineSprites.forEach(sprite => {
                const img = document.createElement("img");
                img.className = "menu-sprite";
                img.src = sprite.spriteIcon;
                img.alt = sprite.name;
                img.style.top = sprite.topPercent + "%";
                img.style.left = sprite.leftPercent + "%";
                img.style.width = sprite.widthPercent + "%";
                img.dataset.spriteId = sprite.id;
                
                if (sprite.type === 'SERVICE') {
                    img.classList.add('service-sprite');
                }

                img.addEventListener("mouseenter", () => {
                    // Hover shows name only
                    if (!selectedSprite) {
                        document.getElementById('infoTitle').innerText = sprite.name;
                        document.getElementById('infoText').innerText = 'Click to learn more...';
                    }
                });

                img.addEventListener("click", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    console.log('🖱️ Click on:', sprite.name);
                    
                    // If same sprite clicked again, deselect
                    if (selectedSprite === img) {
                        resetFooter();
                        return;
                    }
                    
                    // Select this sprite
                    selectSprite(sprite, img);
                    
                    img.classList.add('touched');
                    setTimeout(() => {
                        img.classList.remove('touched');
                    }, 200);
                });

                img.addEventListener("contextmenu", (e) => {
                    e.preventDefault();
                });

                layer.appendChild(img);
            });
        }

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================

        function updateFooter(title, text) {
            document.getElementById("infoTitle").innerText = title;
            document.getElementById("infoText").innerText = text;
        }

        // Click outside to deselect
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-sprite') &&
                !e.target.closest('.footer-content-box') &&
                !e.target.closest('.video-modal')) {
                resetFooter();
            }
        });

        // ============================================================
        // INITIALIZE
        // ============================================================

        buildMenu();

        setTimeout(() => {
            console.log('🪷 Great Buddha Shrine loaded!');
            console.log('💡 Click on altar items to learn their significance');
            console.log('💡 Click on services to participate in rituals');
            console.log('🔍 Pinch-zoom enabled for mobile');
            console.log('🏯 Temple entered state:', templeEntered);
            console.log('🔗 MAIN_PAGE_URL:', MAIN_PAGE_URL);
            
            if (templeEntered) {
                document.getElementById('infoText').innerText = '🪷 Welcome to the Great Buddha Shrine. Tap any item to learn more.';
            }
        }, 100);
    </script>

</body>
</html>
